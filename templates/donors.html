<!DOCTYPE html>
<html>

<head>

    <title>All Donors</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
        }

        .container {
            width: 90%;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #d32f2f;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th {
            background-color: #d32f2f;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .edit-btn {
            background-color: #1976d2;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 5px;
        }

        .delete-btn {
            background-color: #d32f2f;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 5px;
            margin-left: 5px;
        }

        .back-btn {
            display: block;
            width: 200px;
            margin: 30px auto 0;
            padding: 12px;
            text-align: center;
            background-color: #d32f2f;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🩸 All Blood Donors</h1>


    <table>

        <tr>

            <th>Donor ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Blood Group</th>
            <th>Phone</th>
            <th>City</th>
            <th>Action</th>

        </tr>


        {% for donor in donors %}

        <tr>

            <td>{{ donor[0] }}</td>

            <td>{{ donor[1] }}</td>

            <td>{{ donor[2] }}</td>

            <td>{{ donor[3] }}</td>

            <td>{{ donor[4] }}</td>

            <td>{{ donor[5] }}</td>

            <td>{{ donor[6] }}</td>


            <td>

                <a class="edit-btn" href="/edit/{{ donor[0] }}">
                    Edit
                </a>


                <a class="delete-btn"
                   href="/delete/{{ donor[0] }}"
                   onclick="return confirm('Are you sure you want to delete this donor?');">

                    Delete

                </a>

            </td>

        </tr>

        {% endfor %}


    </table>


    <a class="back-btn" href="/">
        ⬅ Back to Home
    </a>


</div>


</body>

</html>
