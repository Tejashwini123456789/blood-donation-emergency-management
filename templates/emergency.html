<!DOCTYPE html>
<html>

<head>

    <title>Emergency Request</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f4f4f4;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: red;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: red;
            color: white;
            border: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🚑 Emergency Blood Request</h1>

        <form method="POST">

            <input type="text" name="patient_name"
                   placeholder="Patient Name" required>

            <select name="blood_group">

                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>

            </select>

            <input type="text" name="hospital"
                   placeholder="Hospital Name" required>

            <input type="text" name="city"
                   placeholder="City" required>

            <input type="text" name="phone"
                   placeholder="Phone Number" required>

            <button type="submit">
                Submit Request
            </button>

        </form>

    </div>

</body>

</html>
