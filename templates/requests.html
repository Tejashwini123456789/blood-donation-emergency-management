<!DOCTYPE html>
<html>

<head>

    <title>Emergency Requests</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
        }

        .container {
            width: 90%;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #d32f2f;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th {
            background-color: #d32f2f;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .back-btn {
            display: block;
            width: 200px;
            margin: 30px auto;
            padding: 12px;
            background-color: #d32f2f;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🚑 Emergency Blood Requests</h1>


    <table>

        <tr>
            <th>Request ID</th>
            <th>Patient Name</th>
            <th>Blood Group</th>
            <th>Hospital</th>
            <th>City</th>
            <th>Phone</th>
        </tr>


        {% for request in requests %}

        <tr>

            <td>{{ request[0] }}</td>
            <td>{{ request[1] }}</td>
            <td>{{ request[2] }}</td>
            <td>{{ request[3] }}</td>
            <td>{{ request[4] }}</td>
            <td>{{ request[5] }}</td>

        </tr>

        {% endfor %}


    </table>


    <a class="back-btn" href="/">
        ⬅ Back to Home
    </a>


</div>


</body>

</html>
