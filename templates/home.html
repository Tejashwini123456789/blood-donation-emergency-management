<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blood Donation System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
        }

        .navbar {
            background-color: #d32f2f;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            text-align: center;
            margin-top: 80px;
        }

        h1 {
            color: #d32f2f;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .btn {
            width: 250px;
            padding: 15px;
            margin: 15px;
            border: none;
            border-radius: 10px;
            background-color: #d32f2f;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #b71c1c;
            transform: scale(1.05);
        }

        .footer {
            margin-top: 100px;
            text-align: center;
            color: gray;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <div class="navbar">
        🩸 Blood Donation and Emergency Management System
    </div>

    <div class="container">

        <h1>Welcome</h1>

        <p>Donate blood and save lives.</p>

        <a href="/register">
            <button class="btn">Donor Registration</button>
        </a>

        <br>

        <a href="/search">
            <button class="btn">Search Donors</button>
        </a>

        <br>

        <a href="/emergency">
            <button class="btn">Emergency Request</button>
        </a>

    </div>

    <div class="footer">
        © 2026 Blood Donation System
    </div>

    <br>

<a href="/donors">
    <button class="btn">View All Donors</button>
</a>

<br>

<a href="/dashboard">
    <button class="btn">Admin Dashboard</button>
</a>

<br>

<a href="/requests">
    <button class="btn">Emergency Requests</button>
</a>

</body>

</html>
